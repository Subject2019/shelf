# EchoShelf 反向代理模板（Nginx）
# 放到 /etc/nginx/conf.d/shelf.conf，证书路径按实际情况改。
# 音频流对缓冲极其敏感：务必保持 proxy_buffering off。

upstream shelf_backend {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name books.example.com;
    # 强制 HTTPS（局域网可删掉本段）
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name books.example.com;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 10G;

    # 安全响应头（前端 CSP 由应用自己给，避免冲突时以应用为准）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    location / {
        proxy_pass         http://shelf_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 关键：音频流必须关闭缓冲，否则拖动进度/首播会卡住
        proxy_buffering         off;
        proxy_request_buffering off;

        # 长时听书，连接不要过早断开
        proxy_connect_timeout 10s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;

        # Range / If-Range 原样透传（不要把 Range 置空！）
    }

    # 封面等静态资源可长缓存
    location ~* ^/api/v1/books/\d+/cover {
        proxy_pass http://shelf_backend;
        proxy_set_header Host $host;
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
