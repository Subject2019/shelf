services:
  shelf:
    image: ghcr.io/subject2019/shelf:0.2.7
    container_name: shelf-fnos
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${TRIM_SERVICE_PORT:-8080}:8080"
    env_file:
      - "${TRIM_PKGETC}/shelf.env"
    environment:
      TZ: Asia/Shanghai
      ECHOSHELF_DATA_PATH: /data
      ECHOSHELF_AUDIOBOOKS_PATH: /audiobooks
      ECHOSHELF_ADMIN_PASSWORD_FILE: /run/secrets/shelf_admin_password
      ECHOSHELF_ALLOW_REGISTRATION: "false"
      PUID: "${TRIM_UID:-1000}"
      PGID: "${TRIM_GID:-1000}"
    volumes:
      - "${TRIM_PKGVAR}/data:/data"
      - "${TRIM_DATA_SHARE_PATHS:-${TRIM_PKGVAR}/media}:/audiobooks:ro"
      - "${TRIM_PKGETC}/admin_password:/run/secrets/shelf_admin_password:ro"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
