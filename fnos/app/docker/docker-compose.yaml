services:
  shelf:
    image: ghcr.io/subject2019/shelf:0.2.8
    container_name: shelf-fnos
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${wizard_port:-${TRIM_SERVICE_PORT:-8080}}:8080"
    environment:
      TZ: Asia/Shanghai
      ECHOSHELF_DATA_PATH: /data
      ECHOSHELF_ADMIN_USERNAME: "${wizard_admin_username:-admin}"
      ECHOSHELF_ADMIN_PASSWORD: "${wizard_admin_password:-}"
      ECHOSHELF_ENABLE_TRANSCODE: "${wizard_enable_transcode:-true}"
      ECHOSHELF_ALLOW_REGISTRATION: "false"
      PUID: "${TRIM_UID:-1000}"
      PGID: "${TRIM_GID:-1000}"
    volumes:
      - "${TRIM_PKGVAR}/data:/data"
      - "${wizard_media_path:-${TRIM_DATA_SHARE_PATHS:-${TRIM_PKGVAR}/media}}:/audiobooks:ro"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
